<!-- Contributing Institutions -->
<section class="bg-gray-50 dark:bg-gray-800 py-12 mt-16">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-6xl">
        <h3 class="text-center text-lg font-semibold text-gray-600 dark:text-gray-400 mb-8">Contributing Institutions</h3>
        <div class="flex flex-wrap justify-center items-center gap-8 md:gap-12">
            <img src="{{ "images/nyu-logo.webp" | relURL }}" alt="New York University" class="h-12 md:h-16 w-auto grayscale hover:grayscale-0 transition-all duration-300 opacity-70 hover:opacity-100">
            <img src="{{ "img/132-1326303_indiana-university-hoosiers-football-team-logo-indiana-university-logo-png.png" | relURL }}" alt="Indiana University" class="h-12 md:h-16 w-auto grayscale hover:grayscale-0 transition-all duration-300 opacity-70 hover:opacity-100">
            <img src="{{ "img/miami-logo.png" | relURL }}" alt="University of Miami" class="h-12 md:h-16 w-auto grayscale hover:grayscale-0 transition-all duration-300 opacity-70 hover:opacity-100">
            <img src="{{ "img/JJCJ_logo.png" | relURL }}" alt="John Jay College of Criminal Justice" class="h-12 md:h-16 w-auto grayscale hover:grayscale-0 transition-all duration-300 opacity-70 hover:opacity-100">
        </div>
    </div>
</section>

<!-- NSF Acknowledgment -->
<section class="py-8 bg-white dark:bg-gray-900">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-6xl text-center">
        <img src="{{ "images/NSF_Official_logo.svg" | relURL }}" alt="NSF Logo" class="h-16 mx-auto mb-4">
        <p class="text-gray-600 dark:text-gray-400">
            This project is funded by the 
            <a href="{{ .Site.Params.nsfAward }}" target="_blank" rel="noopener noreferrer" class="text-emerald-600 dark:text-emerald-400 hover:underline">
                National Science Foundation
            </a>
        </p>
    </div>
</section>
