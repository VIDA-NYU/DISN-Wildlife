<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    {{ range .Pages.ByWeight }}
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden hover:shadow-lg transition-all duration-300 group">
        <div class="p-6 text-center">
            <div class="relative w-32 h-32 mx-auto mb-4">
                <img src="{{ .Params.image }}" 
                     alt="{{ .Title }}" 
                     class="w-full h-full object-cover rounded-full border-4 border-gray-100 dark:border-gray-700 group-hover:border-emerald-500 transition-colors duration-300">
            </div>
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-1">{{ .Title }}</h3>
            {{ with .Params.role }}
            <p class="text-sm text-emerald-600 dark:text-emerald-400 font-medium mb-2">{{ . }}</p>
            {{ end }}
            {{ with .Params.affiliation }}
            <p class="text-xs text-gray-500 dark:text-gray-400 mb-3">{{ . }}</p>
            {{ end }}
            <p class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed mb-4 line-clamp-4">{{ .Content | plainify | truncate 200 }}</p>
            {{ with .Params.website }}
            {{ if ne . "" }}
            <a href="{{ . }}" target="_blank" rel="noopener noreferrer" 
               class="inline-flex items-center text-sm text-emerald-600 dark:text-emerald-400 hover:underline">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
                Website
            </a>
            {{ end }}
            {{ end }}
        </div>
    </div>
    {{ end }}
</div>
